<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Downloader</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center; 
            max-width: 400px; 
            width: 90%; 
        }
        h1 { 
            color: #fe2c55; 
            margin-bottom: 10px; 
            font-size: 28px;
        }
        p {
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input[type="text"] { 
            width: 90%; 
            padding: 12px; 
            margin-bottom: 20px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            font-size: 16px; 
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #fe2c55;
        }
        button { 
            background-color: #fe2c55; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            font-size: 16px; 
            border-radius: 8px; 
            cursor: pointer; 
            width: 97%; 
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover { 
            background-color: #e11d43; 
        }
        .footer { 
            margin-top: 25px; 
            font-size: 12px; 
            color: #999; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TikTok Downloader</h1>
        <p>ටික්ටොක් වීඩියෝ ලින්ක් එක පහතින් ඇතුළත් කරන්න:</p>
        
        <form action="/download" method="POST">
            <input type="text" name="url" placeholder="https://www.tiktok.com/..." required>
            <button type="submit">Download Video</button>
        </form>
        
        <div class="footer">Created with ❤️</div>
    </div>
</body>
  </html>
